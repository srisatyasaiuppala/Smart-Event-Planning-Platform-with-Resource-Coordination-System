{% extends 'base/base.html' %}

{% block content %}
<div class="content-header">
  <div class="container-fluid">
    <h1 class="m-0 text-dark font-weight-bold">Password Changed</h1>
  </div>
</div>

<div class="content mt-3">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card card-success shadow-sm">
          <div class="card-header">
            <h3 class="card-title"><i class="fas fa-check-circle mr-2"></i><strong>Success</strong></h3>
          </div>
          <div class="card-body text-center py-4">
            <h4 class="font-weight-bold text-success mb-3">Password Changed Successfully!</h4>
            <p class="text-muted mb-4">Your account password has been updated. You can now use your new password next time you log in.</p>
            
            <a href="{% url 'dashboard' %}" class="btn btn-primary px-4 mr-2">
              <i class="fas fa-tachometer-alt mr-1"></i> Go to Dashboard
            </a>
            <a href="{% url 'settings' %}" class="btn btn-secondary px-4">
              <i class="fas fa-cog mr-1"></i> Back to Settings
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
