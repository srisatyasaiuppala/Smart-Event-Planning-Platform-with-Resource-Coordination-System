<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Registration</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh; padding: 20px 0;">

<div class="container" style="max-width: 580px;">
  <div class="card card-primary card-outline shadow">
    <div class="card-header text-center bg-white">
      <h3 class="font-weight-bold text-primary mb-0">
        <i class="fas fa-calendar-check mr-2"></i>Event Registration Form
      </h3>
      <p class="text-muted small mb-0 mt-1">Please fill in your details to register for the event</p>
    </div>

    <div class="card-body p-4">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-success text-center">
            <i class="fas fa-check-circle mr-1"></i> {{ message }}
          </div>
        {% endfor %}
      {% endif %}

      <form method="POST">
        {% csrf_token %}
        
        {% for field in form %}
          <div class="form-group mb-3">
            <label class="font-weight-bold text-dark">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
              <div class="text-danger small font-weight-bold mt-1">{{ field.errors.0 }}</div>
            {% endif %}
          </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary btn-block font-weight-bold py-2 mt-4 shadow-sm">
          <i class="fas fa-paper-plane mr-1"></i> Submit Registration
        </button>
      </form>
    </div>
  </div>
</div>

</body>
</html>
